syntax = "proto2";

/*
 * Mirrors the kernel's struct pidfs_attr (fs/pidfs.c): the state pidfs keeps
 * on a struct pid, including what it stashes when the task exits so that
 * userspace can still read it through PIDFD_GET_INFO once the task has been
 * reaped.
 *
 * This deliberately lives outside any file or socket image. A struct pid is
 * shared by everything that refers to the process -- a pidfd file, the pid the
 * kernel attaches to an skb for SCM_CREDENTIALS/SCM_PIDFD -- so its pidfs
 * state is described once and referenced from each of them.
 *
 * Only the exit code is modelled. The rest of what pidfs keeps cannot be
 * reproduced on restore: @cgroupid is meaningless after migration, and the
 * coredump information (@coredump_mask, @coredump_signal, @coredump_code)
 * would require the stand-in process to actually dump core, so a restored
 * dead pid never reports PIDFD_INFO_COREDUMP.
 */
message pidfs_attr_entry {
	// wait(2)-style status of the reaped task, when the kernel could tell
	// us (PIDFD_GET_INFO, Linux 6.13). Its presence mirrors what the
	// kernel tracks as PIDFS_ATTR_BIT_EXIT; absent means the task is known
	// to be dead but the way it died is not.
	optional sint32		exit_code	= 1;
	// The pidfs inode number, which identifies this struct pid. Restore uses
	// it to give everything that referred to one process on dump a single
	// stand-in process, and everything that referred to different processes
	// distinct ones.
	//
	// Only set where this message is the sole carrier of the identity: a
	// pidfd_entry has an ino field of its own. It is optional because the ino
	// is not always there to read -- a queued packet from a reaped sender
	// yields no pidfd to stat on kernels < 6.17 -- and an entry without one
	// falls back on @dump_pid below.
	optional uint64		ino		= 2;
	// The pid number this process had on the dump host. Not an identity of
	// its own: pid numbers are reused, and restore never resolves this one.
	// But among the entries of a single image that carry no ino it is the
	// only thing left to tell two dead processes apart, and it is compared
	// only against other ino-less entries. Without it every packet of one
	// dead sender would claim a stand-in process of its own, so a queue
	// dumped on a kernel that mints no pidfd for a reaped sender would come
	// back as one struct pid per packet, and restore would fork one process
	// per packet to get there.
	optional uint32		dump_pid	= 3;
}
