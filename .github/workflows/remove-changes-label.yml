name: Remove changes requested label

on:
  pull_request:
    types: [synchronize]

permissions:
  pull-requests: write

jobs:
  remove-label:
    runs-on: ubuntu-latest
    steps:
      - name: Remove "changes requested" label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" --remove-label "changes requested" || true
